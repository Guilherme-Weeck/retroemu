<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Arcade - Emulador NES & SNES</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* CONTAINER DO MENU PRINCIPAL */
    #menu {
      z-index: 10;
      background: rgba(20, 20, 20, 0.95);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 1px solid #2a2a2a;
      max-width: 95vw;
      width: 540px;
      margin: 20px 0;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 6px;
      color: #e50914;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 20px;
      text-align: center;
    }

    .section-title {
      font-size: 0.85rem;
      color: #e50914;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 18px 0 8px 0;
      border-bottom: 1px solid #222;
      padding-bottom: 4px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: #ccc;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    /* CLASSE NAV-ITEM: Foco e Navegação por Controle Remoto / D-Pad */
    .nav-item {
      width: 100%;
      background-color: #1a1a1a;
      color: #fff;
      border: 2px solid #333;
      padding: 12px 15px;
      font-size: 0.95rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }

    .nav-item:focus, .nav-item:hover {
      background-color: #e50914;
      border-color: #ffffff;
      transform: scale(1.02);
      box-shadow: 0 0 12px rgba(229, 9, 20, 0.6);
    }

    .btn-danger {
      background-color: #e50914;
      border-color: #e50914;
      font-weight: bold;
      margin-top: 6px;
    }
    .btn-secondary {
      background-color: #282828;
      border-color: #444;
    }

    .row {
      display: flex;
      gap: 10px;
    }
    .row > * {
      flex: 1;
    }

    select option {
      background: #1a1a1a;
      color: #fff;
    }
    
    /* CONTAINER DO EMULADOR */
    #game-container {
      width: 100%;
      height: 100%;
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      background: #000;
      z-index: 50;
    }
    #game {
      width: 100%;
      height: 100%;
    }
    
    /* BOTÃO VOLTAR / TROCAR DE JOGO */
    #back-btn {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 1000;
      display: none;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: 1px solid #555;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.2s;
    }
    #back-btn:hover {
      background: #e50914;
      border-color: #fff;
    }
    
    .status-msg {
      font-size: 0.8rem;
      color: #4caf50;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Botão Discreto de Retorno (Visível apenas durante a gameplay) -->
  <button id="back-btn" onclick="resetToMenu()">⬅ Trocar de ROM / Voltar ao Menu</button>

  <!-- Menu de Configuração -->
  <div id="menu">
    <h1>Retro Arcade</h1>
    <p class="subtitle">Emulador NES (8-bit) & SNES (16-bit)</p>

    <!-- Escolha do Console -->
    <div class="form-group">
      <label for="system-select">Console Padrão:</label>
      <select id="system-select" class="nav-item">
        <option value="nes">Nintendo (NES 8-bit)</option>
        <option value="snes">Super Nintendo (SNES 16-bit)</option>
      </select>
    </div>

    <!-- 1. Carregamento Local -->
    <div class="section-title">📁 Modos Locais (PC / Celular)</div>
    <div class="form-group row">
      <button class="nav-item btn-secondary" onclick="document.getElementById('file-input').click()">
        📄 Selecionar 1 ROM
      </button>
      <button class="nav-item btn-secondary" onclick="document.getElementById('folder-input').click()">
        📂 Selecionar Pasta
      </button>
    </div>

    <!-- Inputs Escondidos -->
    <input type="file" id="file-input" accept=".nes,.smc,.sfc,.zip" style="display:none;" onchange="handleSingleFile(this.files)">
    <input type="file" id="folder-input" webkitdirectory directory multiple style="display:none;" onchange="handleFolderSelect(this.files)">

    <!-- 2. Carregamento por Rede / URL -->
    <div class="section-title">🌐 Modo Rede / Servidor (Smart TV / Cloud)</div>
    <div class="form-group">
      <label for="url-input">URL da ROM ou Pasta do Servidor:</label>
      <input type="text" id="url-input" class="nav-item" placeholder="Ex: https://.../jogo.nes">
    </div>

    <button class="nav-item btn-danger" onclick="handleUrlLoad()">
      🚀 Carregar da URL / Conectar Servidor
    </button>

    <!-- Menu Dropdown Dinâmico (Surgem os jogos encontrados na pasta local ou no servidor) -->
    <div id="scanned-container" class="form-group" style="display:none; margin-top: 15px;">
      <div class="section-title">🎮 Jogos Encontrados</div>
      <select id="scanned-select" class="nav-item"></select>
      <button class="nav-item btn-danger" style="margin-top: 8px;" onclick="launchSelectedFromList()">
        ▶ Iniciar Jogo Selecionado
      </button>
    </div>

    <div id="status-text" class="status-msg"></div>
  </div>

  <!-- Container de Execução do Emulador -->
  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
    let scannedRoms = [];

    // Auto-detecta o console de acordo com a extensão
    function detectSystem(filename, fallbackSystem) {
      const ext = filename.split('.').pop().toLowerCase();
      if (ext === 'nes') return 'nes';
      if (ext === 'smc' || ext === 'sfc') return 'snes';
      return fallbackSystem;
    }

    // Inicializa o EmulatorJS
    function launchGame(romUrl, system) {
      document.getElementById('menu').style.display = 'none';
      document.getElementById('game-container').style.display = 'block';
      document.getElementById('back-btn').style.display = 'block';

      window.EJS_player = '#game';
      window.EJS_core = system;
      window.EJS_gameUrl = romUrl;
      window.EJS_pathtodata = 'data/'; // Pasta offline local do EmulatorJS
      window.EJS_startOnLoaded = true;

      const loader = document.createElement('script');
      loader.id = 'ejs-loader-script';
      loader.src = window.EJS_pathtodata + 'loader.js';
      document.body.appendChild(loader);
    }

    // A. Manipula Arquivo Único Local
    function handleSingleFile(files) {
      if (!files || files.length === 0) return;
      const file = files[0];
      const defaultSys = document.getElementById('system-select').value;
      const sys = detectSystem(file.name, defaultSys);
      const blobUrl = URL.createObjectURL(file);
      launchGame(blobUrl, sys);
    }

    // B. Manipula Pasta Inteira Local
    function handleFolderSelect(files) {
      if (!files || files.length === 0) return;
      scannedRoms = [];
      const validExts = ['.nes', '.smc', '.sfc', '.zip'];

      for (let i = 0; i < files.length; i++) {
        const f = files[i];
        const ext = '.' + f.name.split('.').pop().toLowerCase();
        if (validExts.includes(ext)) {
          scannedRoms.push({
            name: f.name,
            url: URL.createObjectURL(f),
            system: detectSystem(f.name, document.getElementById('system-select').value)
          });
        }
      }

      populateScannedList(scannedRoms);
    }

    // C. Manipula URL Única ou Pasta Remota HTTP
    async function handleUrlLoad() {
      const urlInput = document.getElementById('url-input').value.trim();
      if (!urlInput) {
        alert('Por favor, digite ou cole uma URL válida.');
        return;
      }

      const defaultSys = document.getElementById('system-select').value;
      const cleanUrl = urlInput.split('?')[0].toLowerCase();
      const isDirectFile = ['.nes', '.smc', '.sfc', '.zip'].some(ext => cleanUrl.endsWith(ext));

      if (isDirectFile) {
        // É um link direto para uma ROM única
        const sys = detectSystem(cleanUrl, defaultSys);
        launchGame(urlInput, sys);
      } else {
        // É a URL de uma pasta do servidor -> Faz varredura da listagem de diretório HTTP
        showStatus('Varrendo servidor em busca de jogos...');
        try {
          const response = await fetch(urlInput);
          if (!response.ok) throw new Error('Servidor indisponível ou inacessível.');
          const htmlText = await response.text();

          const parser = new DOMParser();
          const doc = parser.parseFromString(htmlText, 'text/html');
          const links = Array.from(doc.querySelectorAll('a'));

          scannedRoms = [];
          const validExts = ['.nes', '.smc', '.sfc', '.zip'];

          links.forEach(a => {
            const href = a.getAttribute('href');
            if (href) {
              const cleanHref = href.split('?')[0].toLowerCase();
              if (validExts.some(ext => cleanHref.endsWith(ext))) {
                const fullUrl = new URL(href, urlInput).href;
                const fileName = href.split('/').pop();
                scannedRoms.push({
                  name: decodeURIComponent(fileName),
                  url: fullUrl,
                  system: detectSystem(fileName, defaultSys)
                });
              }
            }
          });

          if (scannedRoms.length === 0) {
            alert('Nenhum jogo (.nes, .smc, .sfc, .zip) foi encontrado no endereço informado.');
          } else {
            populateScannedList(scannedRoms);
            showStatus(`${scannedRoms.length} jogo(s) encontrado(s) no servidor!`);
          }
        } catch (err) {
          alert('Erro ao conectar ao servidor: ' + err.message + '\nLembre-se de ativar o suporte a CORS no seu servidor local.');
        }
      }
    }

    // Popula o menu suspenso com a lista de jogos escaneados
    function populateScannedList(roms) {
      const container = document.getElementById('scanned-container');
      const select = document.getElementById('scanned-select');
      select.innerHTML = '';

      roms.forEach((item, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = `${item.name} [${item.system.toUpperCase()}]`;
        select.appendChild(opt);
      });

      container.style.display = 'block';
      updateNavItems();
      select.focus();
    }

    function launchSelectedFromList() {
      const select = document.getElementById('scanned-select');
      const idx = parseInt(select.value);
      if (!isNaN(idx) && scannedRoms[idx]) {
        const item = scannedRoms[idx];
        launchGame(item.url, item.system);
      }
    }

    function resetToMenu() {
      window.location.reload();
    }

    function showStatus(msg) {
      const el = document.getElementById('status-text');
      el.textContent = msg;
      el.style.display = 'block';
    }

    // --- SISTEMA DE FOCO PARA TECLADO E CONTROLE DA TV ---
    let navItems = [];
    let currentIndex = 0;

    function updateNavItems() {
      navItems = Array.from(document.querySelectorAll('.nav-item')).filter(el => {
        return el.offsetParent !== null; // Considera apenas botões/inputs visíveis na tela
      });
    }

    updateNavItems();
    if (navItems.length > 0) navItems[0].focus();

    window.addEventListener('keydown', (e) => {
      if (document.getElementById('menu').style.display !== 'none') {
        updateNavItems();
        if (navItems.length === 0) return;

        if (e.key === 'ArrowDown') {
          currentIndex = (currentIndex + 1) % navItems.length;
          navItems[currentIndex].focus();
          e.preventDefault();
        } else if (e.key === 'ArrowUp') {
          currentIndex = (currentIndex - 1 + navItems.length) % navItems.length;
          navItems[currentIndex].focus();
          e.preventDefault();
        } else if (e.key === 'Enter') {
          if (document.activeElement.tagName !== 'SELECT' && document.activeElement.tagName !== 'INPUT') {
            document.activeElement.click();
          }
        }
      }
    });
  </script>

</body>
</html>
